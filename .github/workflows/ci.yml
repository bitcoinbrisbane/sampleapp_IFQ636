name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile || yarn install

      - name: Run backend tests
        working-directory: backend
        # Run tests if a test/ dir exists; don't fail the build when there are none yet.
        run: |
          if [ -d test ]; then yarn test; else echo "No test/ dir — skipping"; fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install

      - name: Build frontend (production)
        working-directory: frontend
        env:
          CI: false # treat CRA warnings as warnings, not errors
        run: yarn build
